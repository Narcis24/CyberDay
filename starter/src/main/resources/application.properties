# PaySprint Merchant Portal - production configuration (excerpt)

# FIX (A02: Security Misconfiguration): only expose the endpoints actually
# needed, and never show raw config values (may contain secrets).
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=NEVER

# FIX (A02: Security Misconfiguration): don't leak stack traces/internal
# messages to API clients in production.
server.error.include-stacktrace=never
server.error.include-message=never
